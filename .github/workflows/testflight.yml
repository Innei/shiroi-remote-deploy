name: TestFlight (iOS)

on:
  workflow_call:
    inputs:
      source_ref:
        description: 'Resolved SHA in innei-dev/yohaku'
        required: true
        type: string
      notes:
        description: 'Optional notification notes'
        required: false
        type: string
        default: ''
      runtime_fingerprint:
        description: 'Resolved iOS fingerprint from the ship workflow'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref in innei-dev/yohaku (branch, tag, or SHA)'
        required: false
        type: string
        default: main
      notes:
        description: 'Optional notification notes'
        required: false
        type: string

  repository_dispatch:
    types: [trigger-testflight]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  APP_REPO_SLUG: innei-dev/yohaku
  MOBILE_DIR: apps/mobile
  APPLE_TEAM_ID: KAMM5N88X3
  YOHAKU_BUNDLE_ID: in.innei
  YOHAKU_EXTENSION_BUNDLE_ID: in.innei.notification-service
  # EXPO_PUBLIC_* values are inlined into the JS bundle during archive, so they
  # must be set for both prebuild and xcodebuild.
  EXPO_PUBLIC_API_URL: https://mx.innei.in/api/v3
  EXPO_PUBLIC_PUSH_APP_ID: yohaku
  EXPO_PUBLIC_APNS_ENV: production
  EXPO_PUBLIC_PUSH_RELAY_URL: ${{ vars.EXPO_PUBLIC_PUSH_RELAY_URL }}

jobs:
  resolve:
    name: Resolve source
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.ref.outputs.source_ref }}
      notes: ${{ steps.ref.outputs.notes }}
    steps:
      - name: Resolve ref and notes
        id: ref
        env:
          DISPATCH_REF: ${{ github.event.client_payload.source_ref }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_NOTES: ${{ github.event.client_payload.notes }}
          INPUT_REF: ${{ inputs.source_ref }}
          INPUT_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            requested="${DISPATCH_REF:-$DISPATCH_SHA}"
            notes="$DISPATCH_NOTES"
          else
            requested="${INPUT_REF:-main}"
            notes="$INPUT_NOTES"
          fi
          if [ -z "$requested" ]; then
            echo "::error::No source ref provided."
            exit 1
          fi

          source_ref=""
          if [[ "$DISPATCH_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            source_ref="$DISPATCH_SHA"
          fi
          if [ -z "$source_ref" ] && [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            source_ref="$requested"
          fi
          if [ -z "$source_ref" ]; then
            source_ref="$(gh api "repos/${APP_REPO_SLUG}/commits/${requested}" --jq .sha)"
          fi
          if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve ${APP_REPO_SLUG}@${requested} to a full SHA."
            exit 1
          fi

          {
            echo "source_ref=$source_ref"
            echo "notes<<EOF"
            printf '%s\n' "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building $requested → $source_ref"

  fingerprint:
    name: Resolve iOS runtime fingerprint
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APP_REPO_SLUG }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --filter @yohaku/mobile...

      - name: Compute and verify fingerprint
        id: fp
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          EXPECTED: ${{ inputs.runtime_fingerprint }}
        run: |
          ./node_modules/.bin/fingerprint fingerprint:generate \
            --platform ios \
            > "$RUNNER_TEMP/fp.json"
          hash="$(jq -r .hash "$RUNNER_TEMP/fp.json")"
          if [[ ! "$hash" =~ ^[a-zA-Z0-9]{16,}$ ]]; then
            echo "::error::Could not compute iOS fingerprint."
            cat "$RUNNER_TEMP/fp.json" >&2
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "$hash" != "$EXPECTED" ]; then
            echo "::error::Ship fingerprint $EXPECTED does not match TestFlight fingerprint $hash."
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "iOS runtime fingerprint $hash"

  submit:
    name: Archive and upload
    runs-on: macos-26
    needs: [resolve, fingerprint]
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      source_short: ${{ steps.meta.outputs.source_short }}
    env:
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.fingerprint.outputs.hash }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APP_REPO_SLUG }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Record commit
        id: meta
        run: |
          source_sha=$(git rev-parse HEAD)
          source_short=$(git rev-parse --short HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_short=$source_short" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ env.APP_REPO_SLUG }}@$source_short"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --filter @yohaku/mobile...

      - name: Generate native iOS project
        working-directory: ${{ env.MOBILE_DIR }}
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Stamp CI build number
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          info_plist="ios/Yohaku/Info.plist"
          test -f "$info_plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$info_plist"
          stamped="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          test "$stamped" = "$GITHUB_RUN_NUMBER"
          echo "Stamped main app source plist at build $stamped"

      - name: Install CocoaPods
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          pod install --deployment || pod install

      - name: Import signing assets
        env:
          DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_SERVICE_PROFILE }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?}"
          : "${YOHAKU_BUNDLE_ID:?}"
          : "${YOHAKU_EXTENSION_BUNDLE_ID:?}"
          : "${DIST_CERT_P12:?IOS_DIST_CERT_P12 is required}"
          : "${DIST_CERT_PASSWORD:?IOS_DIST_CERT_PASSWORD is required}"
          : "${APP_PROFILE_BASE64:?IOS_APPSTORE_PROFILE is required}"
          : "${EXTENSION_PROFILE_BASE64:?IOS_NOTIFICATION_SERVICE_PROFILE is required}"

          keychain_path="$RUNNER_TEMP/ci.keychain-db"
          keychain_password="$(uuidgen)"
          legacy_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$keychain_path" \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/codesign_allocate
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" > /dev/null

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          if ! grep -q 'Apple Distribution:' <<< "$identities"; then
            echo 'Imported PKCS#12 does not contain an Apple Distribution identity.' >&2
            exit 1
          fi

          mkdir -p "$legacy_profiles" "$xcode_profiles"

          # Prints the profile name on the first line and its UUID on the second.
          install_profile() {
            label="$1"
            payload="$2"
            expected_app_id="$3"
            require_app_capabilities="$4"
            profile_path="$RUNNER_TEMP/$label.mobileprovision"
            profile_plist="$RUNNER_TEMP/$label.plist"

            printf '%s' "$payload" | base64 --decode > "$profile_path"
            decoded_size="$(wc -c < "$profile_path" | tr -d ' ')"
            if [[ "$decoded_size" -lt 1000 ]]; then
              echo "$label decoded profile is ${decoded_size} bytes; expected base64 of a .mobileprovision." >&2
              return 1
            fi
            if ! security cms -D -i "$profile_path" > "$profile_plist"; then
              echo "$label is not a valid CMS provisioning profile." >&2
              return 1
            fi

            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
            profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
            profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
            get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null || printf 'false')"

            if [[ ! "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              echo "$label profile UUID is invalid." >&2
              return 1
            fi
            if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
              echo "$label profile team $profile_team does not match $APPLE_TEAM_ID." >&2
              return 1
            fi
            if [[ "$profile_app_id" != "$expected_app_id" ]]; then
              echo "$label profile application-identifier $profile_app_id does not match $expected_app_id." >&2
              return 1
            fi
            if [[ "$get_task_allow" != 'false' ]]; then
              echo "$label development profile is not allowed; App Store profile required." >&2
              return 1
            fi
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
              echo "$label profile contains devices; App Store profile required." >&2
              return 1
            fi

            if [[ "$require_app_capabilities" == 'true' ]]; then
              associated="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' "$profile_plist" 2>/dev/null || true)"
              aps="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist" 2>/dev/null || printf '')"
              communication="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.usernotifications.communication' "$profile_plist" 2>/dev/null || printf 'false')"
              if [[ -z "$associated" ]]; then
                echo "$label profile is missing Associated Domains." >&2
                return 1
              fi
              if [[ "$aps" != 'production' ]]; then
                echo "$label profile aps-environment is '$aps'; production required." >&2
                return 1
              fi
              if [[ "$communication" != 'true' ]]; then
                echo "$label profile is missing Communication Notifications." >&2
                return 1
              fi
            fi

            cp "$profile_path" "$legacy_profiles/$profile_uuid.mobileprovision"
            cp "$profile_path" "$xcode_profiles/$profile_uuid.mobileprovision"
            printf '%s\n%s\n' "$profile_name" "$profile_uuid"
          }

          app_profile="$(install_profile app "$APP_PROFILE_BASE64" "$APPLE_TEAM_ID.$YOHAKU_BUNDLE_ID" true)"
          extension_profile="$(install_profile notification-service "$EXTENSION_PROFILE_BASE64" "$APPLE_TEAM_ID.$YOHAKU_EXTENSION_BUNDLE_ID" false)"

          {
            echo "IOS_APP_PROFILE_NAME=$(sed -n 1p <<< "$app_profile")"
            echo "IOS_APP_PROFILE_UUID=$(sed -n 2p <<< "$app_profile")"
            echo "IOS_EXTENSION_PROFILE_NAME=$(sed -n 1p <<< "$extension_profile")"
            echo "IOS_EXTENSION_PROFILE_UUID=$(sed -n 2p <<< "$extension_profile")"
          } >> "$GITHUB_ENV"
          echo "Installed profiles: $(sed -n 1p <<< "$app_profile") / $(sed -n 1p <<< "$extension_profile")"

      - name: Apply per-target manual signing
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          YOHAKU_APP_PROFILE_NAME="$IOS_APP_PROFILE_NAME" \
          YOHAKU_EXTENSION_PROFILE_NAME="$IOS_EXTENSION_PROFILE_NAME" \
            node scripts/apply-manual-signing.mjs

      - name: Archive
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodebuild \
            -workspace Yohaku.xcworkspace \
            -scheme Yohaku \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Yohaku.xcarchive" \
            archive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION=1.0.0 \
            | xcbeautify --renderer github-actions

      - name: Verify archive
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Yohaku.xcarchive/Products/Applications/Yohaku.app"
          test -d "$APP"
          ident="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$ident" = "$YOHAKU_BUNDLE_ID"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          if [ "$build_number" != "$GITHUB_RUN_NUMBER" ]; then
            echo "Main app build number $build_number does not match GitHub run number $GITHUB_RUN_NUMBER." >&2
            exit 1
          fi

          appex="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print -quit 2>/dev/null || true)"
          if [ -z "$appex" ]; then
            echo 'Notification service extension is missing from the archive.' >&2
            exit 1
          fi
          appex_ident="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")"
          test "$appex_ident" = "$YOHAKU_EXTENSION_BUNDLE_ID"
          appex_build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$appex/Info.plist")"
          if [ "$appex_build_number" != "$GITHUB_RUN_NUMBER" ]; then
            echo "Notification extension build number $appex_build_number does not match GitHub run number $GITHUB_RUN_NUMBER." >&2
            exit 1
          fi
          extension_point="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")"
          test "$extension_point" = 'com.apple.usernotifications.service'

          expo_plist="$APP/Expo.plist"
          test -f "$expo_plist"
          runtime_config="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$expo_plist")"
          if [ "$runtime_config" = 'file:fingerprint' ]; then
            fingerprint_file="$APP/EXUpdates.bundle/fingerprint"
            if [ ! -f "$fingerprint_file" ]; then
              echo "Archive uses the fingerprint runtime policy but $fingerprint_file is missing." >&2
              exit 1
            fi
            runtime_version="$(tr -d '\r\n' < "$fingerprint_file")"
          else
            runtime_version="$runtime_config"
          fi
          if [ "$runtime_version" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "Archive runtime $runtime_version does not match fingerprint $EXPO_UPDATES_FINGERPRINT_OVERRIDE." >&2
            exit 1
          fi

          entitlements="$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements :- --xml "$APP" > "$entitlements" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$entitlements")" = 'production'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.usernotifications.communication' "$entitlements")" = 'true'
          echo "Archive contains $appex_ident signed alongside $ident at build $build_number runtime $runtime_version ($runtime_config)"

      - name: Prepare App Store Connect authentication
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          : "${ASC_KEY_ID:?ASC_KEY_ID is required}"
          : "${ASC_API_KEY_P8:?ASC_API_KEY_P8 is required}"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$YOHAKU_BUNDLE_ID</key><string>$IOS_APP_PROFILE_NAME</string>
              <key>$YOHAKU_EXTENSION_BUNDLE_ID</key><string>$IOS_EXTENSION_PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Yohaku.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP/app.plist" "$RUNNER_TEMP/notification-service.plist"
          for uuid in "${IOS_APP_PROFILE_UUID:-}" "${IOS_EXTENSION_PROFILE_UUID:-}"; do
            if [[ "$uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            fi
          done

  record-baseline:
    name: Record iOS fingerprint baseline
    runs-on: ubuntu-latest
    needs: [fingerprint, submit]
    if: ${{ needs.submit.result == 'success' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Store YOHAKU_IOS_FINGERPRINT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HASH: ${{ needs.fingerprint.outputs.hash }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/actions/variables/YOHAKU_IOS_FINGERPRINT" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/YOHAKU_IOS_FINGERPRINT" -f value="$HASH"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/variables" -f name=YOHAKU_IOS_FINGERPRINT -f value="$HASH"
          fi
          echo "Recorded YOHAKU_IOS_FINGERPRINT=$HASH"

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [resolve, submit]
    if: ${{ always() && needs.resolve.result == 'success' }}
    steps:
      - name: Notify
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RES_SUBMIT: ${{ needs.submit.result }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.submit.outputs.source_sha }}
          SOURCE_SHORT: ${{ needs.submit.outputs.source_short }}
          NOTES: ${{ needs.resolve.outputs.notes }}
          APP_REPO_SLUG: ${{ env.APP_REPO_SLUG }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN is not set; skipping Telegram notification."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL=""
          if [ -n "${SOURCE_SHA:-}" ]; then
            COMMIT_URL="https://github.com/${APP_REPO_SLUG}/commit/${SOURCE_SHA}"
          fi
          COMPLETED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export RUN_URL COMMIT_URL COMPLETED_AT

          MSG="$(python3 <<'PY'
          import html
          import os

          def esc(s: str) -> str:
              return html.escape(s or "", quote=False)

          ok = os.environ.get("RES_SUBMIT") == "success"
          title = "✅ Yohaku TestFlight 已提交" if ok else "❌ Yohaku TestFlight 失败"
          source_ref = esc(os.environ.get("SOURCE_REF") or "")
          source_short = esc(os.environ.get("SOURCE_SHORT") or "")
          source_sha = os.environ.get("SOURCE_SHA") or ""
          notes = (os.environ.get("NOTES") or "").strip()
          run_url = os.environ["RUN_URL"]
          commit_url = os.environ.get("COMMIT_URL") or ""
          completed = esc(os.environ["COMPLETED_AT"])
          actor = esc(os.environ["GITHUB_ACTOR"])
          event = esc(os.environ["GITHUB_EVENT_NAME"])
          wf = esc(os.environ["GITHUB_WORKFLOW"])
          rn = esc(os.environ["GITHUB_RUN_NUMBER"])
          slug = esc(os.environ["APP_REPO_SLUG"])

          parts = [
              f"<b>{title}</b>",
              f"<b>源</b>: <code>{slug}</code> @ <code>{source_ref}</code>",
          ]
          if source_short:
              line = f"<code>{source_short}</code>"
              if commit_url:
                  line += f' · <a href="{commit_url}">打开提交</a>'
              parts.append(f"<b>提交</b>: {line}")
          elif source_sha:
              parts.append(f"<b>提交</b>: <code>{esc(source_sha[:12])}</code>")

          parts.extend(
              [
                  f"<b>触发</b>: {actor} · <code>{event}</code>",
                  f"<b>Workflow</b>: {wf} · #{rn}",
              ]
          )
          if notes:
              preview = notes.splitlines()[0][:220]
              parts.extend(["", f"<b>Notes</b>\n{esc(preview)}"])
          parts.extend(
              [
                  "",
                  f"<b>🕐 {completed}</b>",
                  f'<a href="{run_url}">打开 GitHub Actions</a>',
              ]
          )
          print("\n".join(parts))
          PY
          )"

          jq -n \
            --arg text "$MSG" \
            '{chat_id: "@order_usagi", text: $text, parse_mode: "HTML", disable_web_page_preview: true}' \
            | curl -sS -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d @-
