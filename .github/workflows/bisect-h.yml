name: TestFlight (iOS)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref in innei-dev/yohaku (branch, tag, or SHA)'
        required: false
        type: string
        default: main
      notes:
        description: 'Optional notification notes'
        required: false
        type: string

  repository_dispatch:
    types: [trigger-testflight]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_REPO_SLUG: innei-dev/yohaku
  MOBILE_DIR: apps/mobile
  APPLE_TEAM_ID: KAMM5N88X3
  YOHAKU_BUNDLE_ID: in.innei

jobs:
  submit_only:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APP_REPO_SLUG }}
          token: ${{ secrets.GH_PAT }}
          ref: ${{ needs.resolve.outputs.source_ref }}
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Record commit
        id: meta
        run: |
          source_sha=$(git rev-parse HEAD)
          source_short=$(git rev-parse --short HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_short=$source_short" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ env.APP_REPO_SLUG }}@$source_short"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --filter @yohaku/mobile...

